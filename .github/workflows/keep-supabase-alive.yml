name: Keep Supabase Alive

on:
  schedule:
    # Runs every 2 days at 06:00 UTC (well within the 7-day inactivity pause limit)
    - cron: '0 6 */2 * *'
  # Allows manual trigger anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST API
        run: |
          echo "Pinging Supabase keep_alive endpoint..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          
          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)
          
          echo "HTTP Status Code: $status"
          echo "Response Body: $body"
          
          if [ "$status" -ne 200 ]; then
            echo "❌ Keep-alive query failed! HTTP code: $status"
            exit 1
          fi
          
          echo "✅ Supabase database is awake and active!"
